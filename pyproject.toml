[project]
name = "agent"
version = "0.1.0"
description = "A general-purpose command-line assistant built on the Claude Agent SDK"
requires-python = ">=3.10"
dependencies = ["claude-agent-sdk>=0.2.160"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
agent = "agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
